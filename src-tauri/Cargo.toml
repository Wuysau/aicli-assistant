[package]
name = "aicli-assistant"
version = "0.1.0"
description = "AI CLI Assistant desktop shell"
authors = ["Wuysau"]
license = ""
repository = "https://github.com/Wuysau/aicli-assistant"
homepage = "https://github.com/Wuysau/aicli-assistant"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aicli_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
arboard = "3.6.1"
dotenvy = "0.15.7"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
